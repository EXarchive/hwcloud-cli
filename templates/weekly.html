<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><title>{{title}}</title></head>
<body style="margin:0;background:#f5f7fb;font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;color:#1f2937">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:28px 0">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb">
        <tr><td style="padding:22px 28px;background:#4f46e5;color:#fff;font-size:18px;font-weight:600">{{title}}</td></tr>
        <tr><td style="padding:24px 28px;font-size:14px;line-height:1.8">
          <p style="margin:0 0 12px">你好，{{name}}：</p>
          <p style="margin:0 0 16px">{{summary}}</p>
          <p style="margin:0 0 16px;color:#374151">{{highlights}}</p>
          <p style="margin:0;color:#6b7280;font-size:13px">{{footer}}</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
